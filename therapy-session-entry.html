<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FORM DASHBOARD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#0A0A0A; --muted:#575757; --line:#E2E2E2; --line-strong:#B8B8B8;
  --orange:#F26A1B; --orange-ink:#0A0A0A; --chip-dark:#0A0A0A; --chip-dark-ink:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0A; --surface:#161616; --ink:#FFFFFF; --muted:#ABABAB; --line:#2C2C2C; --line-strong:#4A4A4A;
    --chip-dark:#FFFFFF; --chip-dark-ink:#0A0A0A;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#161616; --ink:#FFFFFF; --muted:#ABABAB; --line:#2C2C2C; --line-strong:#4A4A4A;
  --chip-dark:#FFFFFF; --chip-dark-ink:#0A0A0A;
}
html{background:#0A0A0A;scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Archivo","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;min-height:100vh}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
.top{background:#0A0A0A;color:#FFFFFF;border-bottom:6px solid var(--orange)}
.head{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;padding-top:36px;padding-bottom:28px}
h1{font-size:2.6rem;line-height:1.05;font-weight:800;letter-spacing:-.02em;margin:0 0 10px}
.sub{margin:0;color:#D0D0D0;max-width:52ch}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{display:flex;align-items:baseline;gap:8px;background:var(--orange);color:var(--orange-ink);padding:10px 16px;border-radius:6px}
.stat strong{font-size:2rem;line-height:1;font-weight:800}
.stat span{font-weight:600}
main{padding-top:24px;padding-bottom:48px}
.controls{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:end}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>span.lbl{font-size:.85rem;font-weight:600;color:var(--muted)}
input[type=search],input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line-strong);border-radius:6px;padding:10px 12px;min-height:46px;width:100%}
.seg{display:flex;border:1.5px solid var(--line-strong);border-radius:6px;overflow:hidden;min-height:46px}
.seg button{font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:0;border-right:1.5px solid var(--line-strong);padding:0 14px;cursor:pointer;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input:focus-visible,.seg button:focus-visible,a.row:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.count{margin:18px 0 10px;color:var(--muted);font-size:.9rem}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
a.row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) auto;gap:8px 18px;align-items:center;padding:16px 18px;background:var(--surface);border:1.5px solid var(--line);border-left:8px solid var(--orange);border-radius:6px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.row:hover{border-color:var(--ink);border-left-color:var(--orange);transform:translateX(2px)}
.name{font-weight:800;font-size:1.2rem;line-height:1.2}
.meta{color:var(--muted);font-size:.9rem;margin-top:2px}
.find{font-size:.95rem}
.act{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.chip{padding:2px 10px;border-radius:999px;font-size:.82rem;font-weight:600;background:var(--chip-dark);color:var(--chip-dark-ink);white-space:nowrap}
.chip.malcolm{background:var(--orange);color:var(--orange-ink)}
.open-icon{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;color:var(--muted);transition:color .15s,transform .15s}
.open-icon svg{width:18px;height:18px;stroke:currentColor}
a.row:hover .open-icon{color:var(--orange);transform:translate(2px,-2px)}
.empty{padding:24px;border:1.5px dashed var(--line-strong);border-radius:6px;color:var(--muted)}
.note{margin-top:28px;font-size:.85rem;color:var(--muted);max-width:70ch}
@media (prefers-reduced-motion:reduce){a.row{transition:none}a.row:hover{transform:none}}
@media (max-width:680px){
  body{font-size:16px}
  .wrap{padding-left:16px;padding-right:16px}
  .head{align-items:flex-start;padding-top:24px;padding-bottom:20px}
  h1{font-size:2rem}
  .sub{font-size:.95rem}
  .stat{padding:8px 12px}
  main{padding-top:18px;padding-bottom:max(32px,env(safe-area-inset-bottom,32px))}
  .controls{grid-template-columns:1fr;gap:12px}
  input[type=search],input[type=date]{min-height:48px;font-size:16px}
  .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible}
  .seg button{min-width:0;min-height:48px;padding:6px 4px;white-space:normal;line-height:1.15}
  .count{margin-top:14px}
  ul{gap:8px}
  a.row{grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:14px 14px 12px;border-left-width:6px}
  a.row:hover{transform:none}
  .name{font-size:1.1rem}
  .meta{line-height:1.35}
  .find{grid-column:1/-1;overflow-wrap:anywhere}
  .act{grid-column:2;grid-row:1;flex-direction:column;align-items:center;justify-self:end;gap:6px}
  .chip{min-height:28px;display:inline-flex;align-items:center}
  .open-icon{width:28px;height:28px}
}
@media (max-width:420px){
  .wrap{padding-left:12px;padding-right:12px}
  .head{gap:14px}
  h1{font-size:1.75rem}
  .stat strong{font-size:1.65rem}
  .stat{width:100%;justify-content:center}
  .seg button{font-size:.82rem}
  a.row{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap head">
  <div>
    <h1>FORM DASHBOARD</h1>
    <p class="sub">Last Edited - Dr. Malcolm Shadrach (OT) | 18/11/26</p>
  </div>
  <div class="stats">
    <div class="stat"><strong id="inpatient">0</strong><span>in-patients</span></div>
    <div class="stat"><strong id="outpatient">0</strong><span>out-patients</span></div>
  </div>
</div></header>
<main class="wrap">
  <div class="controls">
    <div class="field"><label for="q">Find a patient</label><input id="q" type="search" placeholder="Start typing a name" autocomplete="off"></div>
    <div class="field"><span class="lbl" id="faclbl">Faculty</span>
      <div class="seg" role="group" aria-labelledby="faclbl">
        <button type="button" data-f="" aria-pressed="true">All</button>
        <button type="button" data-f="Dr. Kavin" aria-pressed="false">Dr. Kavin</button>
        <button type="button" data-f="Dr. Malcolm" aria-pressed="false">Dr. Malcolm</button>
      </div></div>
    <div class="field"><label for="date">Session date (used in every form)</label><input id="date" type="date"></div>
  </div>

  <p class="count" id="count" aria-live="polite"></p>
  <ul id="list"></ul>
  <p class="note">Last Edited - Dr. Malcolm Shadrach (OT) | 18/11/26</p>
</main>

<script>
var FORM = "https://docs.google.com/forms/d/e/1FAIpQLSfsCKihOQ5Uf5benRMDo3GYTd2jANXfW1gLHBENosgthFwuGA/viewform";
var P = [
 {n:"Ramkanth",a:38,s:"Male",f:"Dr. Kavin",find:["CRS-R - 1"],g:["To improve ROM of Left Upper Limb","To improve sitting balance"]},
 {n:"Anbarasan",a:39,s:"Male",f:"Dr. Malcolm",find:["CRS-R - 6"],g:["To improve arousal and response to stimuli"]},
 {n:"Angarathinam",a:68,s:"Female",f:"Dr. Malcolm",find:["MG-ADL - 17","MGC - 46"],g:["To maintain joint range of motion in upper and lower limbs","To maintain static sitting with supported"]},
 {n:"Divya",a:37,s:"Female",f:"Dr. Malcolm",sum:"ASIA motor and sensory scores",find:["ASIA -","MOTOR:","1. UE RIGHT - 14","2. UE LEFT - 14","3. LE RIGHT - 1","4. LE LEFT - 13","SENSORY:","1. LT RIGHT - 31","2. LT LEFT - 31","3. PP RIGHT - 46","4. PP LEFT - 46"],g:["To improve fine motor skills","To improve static sitting balance"]},
 {n:"Soundhari Sakthivel",a:48,s:"Female",f:"Dr. Kavin",find:["Brunnstrom Stage - 1 (Global) - Right"],g:["To improve tone in right upper extremity","To improve trunk control and static sitting balance"]},
 {n:"Samivel",a:51,s:"Male",f:"Dr. Malcolm",find:["Brunnstrom Stage - 1 (Global) - Right"],g:["To improve tone in right upper extremity","To improve trunk control and static sitting balance"]},
 {n:"Iyyanar Balu",a:26,s:"Male",f:"Dr. Malcolm",find:["RLA - IX","FIST - 15/56"],g:["To improve voluntary movement and range of motion in upper limb","To normalize muscle tone in upper limbs","To improve sitting balance"]},
 {n:"Jayakumar",a:39,s:"Male",f:"Dr. Kavin",find:["CRS-R - 10","Brunnstrom Stage - 2 (Global) - Left"],g:["To improve arousal and response to stimuli","To normalize muscle tone in upper extremities"]},
 {n:"Sanjay",a:15,s:"Male",f:"Dr. Kavin",find:["RLA - III"],g:["To improve arousal and response to stimuli"]},
 {n:"Selvakumaran",a:56,s:"Male",f:"Dr. Kavin",find:["FMAUE - 20/66","FIM - 68/126"],g:["To improve voluntary movement in right upper limb","To normalize muscle tone in right upper limb","To improve independence in transfers"]},
 {n:"Usha Devi",a:44,s:"Female",f:"Dr. Malcolm",find:["CRS-R - 10","Brunnstrom Stage - 2 (Global) - Left"],g:["To improve arousal and response to stimuli","To normalize muscle tone in upper extremities"]}
].sort(function(x,y){return x.n.localeCompare(y.n)});

var q=document.getElementById("q"), dt=document.getElementById("date"), facVal="";
var segBtns=document.querySelectorAll(".seg button");
var list=document.getElementById("list"), count=document.getElementById("count");

function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
dt.value=today();

function patientType(p){return p.type||"In-patient"}

function link(p){
  var u=new URLSearchParams();
  u.set("usp","pp_url");
  u.set("entry.911981136",p.n);
  u.set("entry.764809273",String(p.a));
  u.set("entry.1879503323",p.s);
  u.set("entry.196530438",patientType(p));
  u.set("entry.1802756912",p.f);
  u.set("entry.1894555099",dt.value||today());
  u.set("entry.1415996385",p.find.join("\n"));
  u.set("entry.2089477400",p.g.join("\n"));
  return FORM+"?"+u.toString();
}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}

function render(){
  var term=q.value.trim().toLowerCase(), f=facVal;
  var rows=P.filter(function(p){return (!f||p.f===f)&&(!term||p.n.toLowerCase().indexOf(term)>-1)});
  list.textContent="";
  rows.forEach(function(p){
    var li=document.createElement("li"), a=el("a","row"+(p.f==="Dr. Malcolm"?" malcolm":""));
    a.href=link(p); a.target="_blank"; a.rel="noopener";
    a.setAttribute("aria-label","Open session form for "+p.n);
    var left=el("div"); left.appendChild(el("div","name",p.n)); left.appendChild(el("div","meta",p.a+" years, "+p.s+", In-patient"));
    a.appendChild(left);
    a.appendChild(el("div","find",p.sum||p.find.join("; ")));
    var act=el("div","act"); act.appendChild(el("span","chip"+(p.f==="Dr. Malcolm"?" malcolm":""),p.f));
    var icon=el("span","open-icon"); icon.setAttribute("aria-hidden","true"); icon.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg>'; act.appendChild(icon); a.appendChild(act);
    li.appendChild(a); list.appendChild(li);
  });
  if(!rows.length){var li=document.createElement("li");li.appendChild(el("div","empty","No patients match. Clear the search or choose all faculty."));list.appendChild(li)}
  count.textContent=rows.length+" of "+P.length+" patients";
}
q.addEventListener("input",render); dt.addEventListener("change",render);
segBtns.forEach(function(b){b.addEventListener("click",function(){facVal=b.getAttribute("data-f");segBtns.forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false")});render()})});
document.getElementById("inpatient").textContent=P.filter(function(p){return patientType(p)==="In-patient"}).length;
document.getElementById("outpatient").textContent=P.filter(function(p){return patientType(p)==="Out-patient"}).length;
render();
</script>
</body>
</html>
