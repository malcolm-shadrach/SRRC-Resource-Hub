<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRRC Resource Hub</title>
<meta name="description" content="Link hub for the Neuro-Occupational Therapy Unit, Sahaya Sri Ramachandra Rehabilitation Centre.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#000000;
    --ink-800:#0A0A0A;
    --ink-700:#161616;
    --ink-600:#2A2A2A;
    --paper:#FFFFFF;
    --paper-dim:#8C8C8C;
    --amber:#F2600C;
    --amber-dim:#C94E09;
    --mint:#FFFFFF;
    --radius:14px;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(242,96,12,0.16), transparent 60%),
      linear-gradient(180deg, var(--ink-800) 0%, var(--ink-900) 100%);
    color:var(--paper);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:64px 20px 40px;
    position:relative;
    overflow-x:hidden;
  }

  /* faint trace motif */
  .trace{
    position:fixed;
    left:0; right:0; top:38%;
    width:100%;
    height:220px;
    pointer-events:none;
    opacity:0.10;
    z-index:0;
  }
  .trace svg{ width:200%; height:100%; }
  .trace path{
    stroke:var(--mint);
    stroke-width:1.4;
    fill:none;
  }
  @media (prefers-reduced-motion: no-preference){
    .trace svg{ animation: drift 48s linear infinite; }
  }
  @keyframes drift{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }

  main{
    position:relative;
    z-index:1;
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--mint);
    margin-bottom:22px;
    opacity:0.9;
  }

  .mark{
    width:66px;
    height:66px;
    margin-bottom:22px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:clamp(26px, 6vw, 34px);
    line-height:1.15;
    text-align:center;
    letter-spacing:0.01em;
    margin:0 0 10px;
    color:var(--paper);
  }

  .tagline{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:400;
    font-size:16px;
    text-align:center;
    color:var(--paper-dim);
    margin:0 0 44px;
    max-width:340px;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link-card{
    display:flex;
    align-items:center;
    gap:16px;
    width:100%;
    padding:18px 20px;
    background:var(--ink-700);
    border:1px solid var(--ink-600);
    border-radius:var(--radius);
    text-decoration:none;
    color:var(--paper);
    transition:transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    position:relative;
  }

  .link-card:hover, .link-card:focus-visible{
    transform:translateY(-2px);
    border-color:var(--amber);
    background:#1F1F1F;
  }

  .link-card:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:2px;
  }

  .icon{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border-radius:10px;
    background:rgba(242,96,12,0.14);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon svg{ width:20px; height:20px; stroke:var(--amber); }

  .link-text{ flex:1 1 auto; min-width:0; }

  .link-title{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:16px;
    margin:0 0 2px;
  }

  .link-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--paper-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .arrow{
    flex:0 0 auto;
    color:var(--paper-dim);
    transition:transform 0.18s ease, color 0.18s ease;
  }
  .link-card:hover .arrow{ transform:translateX(3px); color:var(--amber); }

  footer{
    margin-top:56px;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--paper-dim);
    opacity:0.65;
  }

  footer span{ color:var(--mint); }
</style>
</head>
